services:
  app:
    build:
      context: .
      secrets:
        - composer_auth
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY}
      APP_URL: http://localhost:8080
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: visual_builder
      DB_USERNAME: visual_builder
      DB_PASSWORD: visual_builder
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: visual_builder
      POSTGRES_USER: visual_builder
      POSTGRES_PASSWORD: visual_builder
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visual_builder -d visual_builder"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

secrets:
  composer_auth:
    file: ./auth.json

name: Build Windows application

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      NATIVEPHP_APP_VERSION: 1.0.${{ github.run_number }}
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: fileinfo, zip, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Configure Flux Pro authentication
        shell: pwsh
        run: composer config --global http-basic.composer.fluxui.dev "$env:FLUX_USERNAME" "$env:FLUX_LICENSE_KEY"
        env:
          FLUX_USERNAME: ${{ secrets.FLUX_USERNAME }}
          FLUX_LICENSE_KEY: ${{ secrets.FLUX_LICENSE_KEY }}

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Initialize application
        shell: pwsh
        run: |
          Copy-Item .env.example .env
          New-Item database/database.sqlite -ItemType File -Force
          php artisan key:generate
          php artisan migrate --force

      - name: Install frontend dependencies
        run: npm ci

      - name: Run quality checks
        run: composer ci:check

      - name: Build unsigned internal-test installer
        run: php artisan native:build win x64 --no-interaction

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: VisualBuilder-Windows-x64
          path: nativephp/**
          if-no-files-found: error
          retention-days: 14

name: Publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: code/legacy-laravel
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
      NATIVEPHP_UPDATER_ENABLED: true
      NATIVEPHP_UPDATER_PROVIDER: github
      GITHUB_OWNER: cjrowell1980
      GITHUB_REPO: VisualBuilder
      GITHUB_PRIVATE: false
      GITHUB_CHANNEL: latest
      GITHUB_RELEASE_TYPE: draft
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set application version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
              throw 'Release tags must use semantic versions such as v1.1.0.'
          }
          "NATIVEPHP_APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: fileinfo, zip, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code/legacy-laravel/package-lock.json

      - name: Configure Flux Pro authentication
        shell: pwsh
        run: composer config --global http-basic.composer.fluxui.dev "$env:FLUX_USERNAME" "$env:FLUX_LICENSE_KEY"
        env:
          FLUX_USERNAME: ${{ secrets.FLUX_USERNAME }}
          FLUX_LICENSE_KEY: ${{ secrets.FLUX_LICENSE_KEY }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Initialize application
        shell: pwsh
        run: |
          Copy-Item .env.example .env
          New-Item database/database.sqlite -ItemType File -Force
          php artisan key:generate
          php artisan migrate --force

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Run quality checks
        run: composer ci:check

      - name: Create draft release
        shell: pwsh
        run: |
          gh release view '${{ github.ref_name }}' 2>$null
          if ($LASTEXITCODE -ne 0) {
              gh release create '${{ github.ref_name }}' --draft --generate-notes --title 'VisualBuilder ${{ github.ref_name }}'
          }

      - name: Build and publish updater assets
        run: php artisan native:publish win x64 --no-interaction

      - name: Publish release
        run: gh release edit '${{ github.ref_name }}' --draft=false --latest
